# =========================================================
# Desarrollo local
# =========================================================

# Datasource local (se puede sobreescribir con DB_URL/DB_USERNAME/DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/micarro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Endpoints internos/dev habilitados en local
app.dev-endpoints-enabled=true

# CORS local
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# JWT con secreto de desarrollo por defecto (en prod es obligatorio por entorno)
app.jwt.secret=${JWT_SECRET:micarro-dev-secret-key-change-me-please-32bytes}

# Logs de desarrollo
spring.jpa.show-sql=true
logging.level.com.micarro.backend=DEBUG
