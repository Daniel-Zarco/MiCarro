spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/micarro
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (el secreto se toma de la variable de entorno JWT_SECRET)
app.jwt.secret=${JWT_SECRET:micarro-dev-secret-key-change-me-please-32bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Incluye el motivo en los errores (p. ej. email duplicado).
server.error.include-message=always
