spring.application.name=backend

# Perfil por defecto (local). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# El esquema lo gestiona Flyway; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate

# Flyway (común a todos los entornos).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT: expiración común. El secreto lo define cada perfil.
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Fuente externa Mercadona (override con MERCADONA_BASE_URL).
app.mercadona.base-url=${MERCADONA_BASE_URL:https://tienda.mercadona.es/api}

# Endpoints internos/dev desactivados por defecto; dev los activa.
app.dev-endpoints-enabled=false

# CORS por defecto local; producción exige FRONTEND_URL.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Sincronización periódica del catálogo (deshabilitada por defecto).
app.catalog-sync.enabled=${CATALOG_SYNC_ENABLED:false}
app.catalog-sync.cron=${CATALOG_SYNC_CRON:0 0 4 * * *}

# Actuator: exponer únicamente /actuator/health y sin detalles sensibles.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
