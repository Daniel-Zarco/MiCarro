# =========================================================
# Producción
# =========================================================

# Datasource completamente desde variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT_SECRET obligatorio (sin valor por defecto)
app.jwt.secret=${JWT_SECRET}

# Endpoints internos/dev deshabilitados: no se registran
app.dev-endpoints-enabled=false

# CORS múltiple: localhost para pruebas y frontend público configurado por entorno.
app.cors.allowed-origins=http://localhost:4200,${FRONTEND_URL}

# Logs de producción
spring.jpa.show-sql=false
logging.level.root=INFO
